name: Build Pentax K-1 Sync v6 (SpektraLab + LibRaw) APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK (NDK + Vulkan + LibRaw)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: find_project
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle.kts in repository!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Detected Android project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Decode optional fixed Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "Custom fixed release keystore enabled."
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret set; using standard debug signing."
          fi

      - name: Install glslang-tools for Vulkan SPIR-V compilation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK 27 & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare SpektraLab Engine, LibRaw 0.22.2 & SPIR-V Shaders
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: bash scripts/prepare_spektra_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK (arm64-v8a)
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace --info

      - name: Prepare Release Artifact
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/PentaxK1Sync-v7.0.5-release.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentaxK1Sync-v7.0.5-APK
          path: dist/*.apk
          retention-days: 30
